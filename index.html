    function getActiveTopicsForDate(subjectId, isoDate) {
      const sub = CURRICULUM[subjectId];
      if (!sub) return [];
      const month = parseInt(isoDate.split("-")[1], 10);
      if (month === 9 || month === 10) return sub.konular.erken;
      if (month === 11 || month === 12 || month === 1) return sub.konular.kasim;
      return sub.konular.genel;
    }

    function formatTurkishDate(isoDate) {
      const parts = isoDate.split("-");
      if (parts.length !== 3) return isoDate;
      const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
      return d.toLocaleDateString("tr-TR", { day: "numeric", month: "long", year: "numeric" });
    }
